name: CI

on:
  push:
  pull_request:

jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate the notebook with nbformat
        run: python -c "import nbformat; nb = nbformat.read('ML.ipynb', as_version=4); nbformat.validate(nb); print('valid notebook,', len(nb.cells), 'cells')"
      - name: Execute the notebook on the pinned scikit-learn
        run: jupyter nbconvert --to notebook --execute "ML.ipynb" --output "$RUNNER_TEMP/executed.ipynb" --ExecutePreprocessor.timeout=300
      - name: Check the printed results against the committed outputs
        run: |
          python - <<'PY'
          import os, nbformat
          nb = nbformat.read(os.path.join(os.environ["RUNNER_TEMP"], "executed.ipynb"), as_version=4)
          text = "".join(o.get("text", "") for c in nb.cells if c.cell_type == "code" for o in c.get("outputs", []))
          assert text.count("Found 4 total clusters!") == 3, text
          assert "49 points were dropped as noise." in text, text
          print("cluster counts and DBSCAN noise count match the committed outputs")
          PY
